# Деплой: код на сервере обновляется через git (fetch + reset на origin), не через rsync.
# Runner только: генерирует .env из секретов, копирует по SSH, запускает сборку на VPS.
#
# Один раз на сервере: git clone репозитория в DEPLOY_PATH и настройка доступа к GitHub
# (SSH deploy key / HTTPS token в credential helper), чтобы git pull/fetch работал без пароля.
#
# Секреты GitHub → Settings → Actions:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
#   AUTH_SECRET (обязательно)
# Опционально: NEXTAUTH_URL, DATABASE_URL, SSH_PORT, DEPLOY_BRANCH (по умолчанию main)
# Nginx/Certbot: CERTBOT_EMAIL, PUBLIC_DOMAIN, INCLUDE_WWW, APP_PORT
#
# Для HTTPS: sudo без пароля; DNS A-запись на сервер.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Generate .env, git pull on server, deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH || 'main' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://altdi.ru' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN || 'altdi.ru' }}
          INCLUDE_WWW: ${{ secrets.INCLUDE_WWW }}
          APP_PORT: ${{ secrets.APP_PORT || '3000' }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "Missing SSH_PRIVATE_KEY"; exit 1; }
          test -n "${SSH_HOST:-}" || { echo "Missing SSH_HOST"; exit 1; }
          test -n "${SSH_USER:-}" || { echo "Missing SSH_USER"; exit 1; }
          test -n "${DEPLOY_PATH:-}" || { echo "Missing DEPLOY_PATH"; exit 1; }
          test -n "${AUTH_SECRET:-}" || { echo "Missing AUTH_SECRET"; exit 1; }

          python3 << 'PY'
          import os
          def esc(s):
              return s.replace("\\", "\\\\").replace('"', '\\"')
          auth = os.environ.get("AUTH_SECRET", "").strip()
          if not auth:
              raise SystemExit("AUTH_SECRET is empty")
          db = (os.environ.get("DATABASE_URL") or "").strip() or "file:./prisma/prod.db"
          url = (os.environ.get("NEXTAUTH_URL") or "").strip() or "https://altdi.ru"
          with open(".env", "w", encoding="utf-8") as f:
              f.write(f'DATABASE_URL="{esc(db)}"\n')
              f.write(f'AUTH_SECRET="{esc(auth)}"\n')
              f.write(f'NEXTAUTH_URL="{esc(url)}"\n')
          PY

          PORT="${SSH_PORT:-22}"
          BRANCH="${DEPLOY_BRANCH:-main}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          SCP_OPTS=(-i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new)

          scp "${SCP_OPTS[@]}" .env "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.env"

          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "cd $(printf %q "$DEPLOY_PATH") && \
             test -d .git || { echo 'В DEPLOY_PATH должен быть git clone. См. README.'; exit 1; } && \
             git fetch origin && \
             git checkout $(printf %q "$BRANCH") && \
             git reset --hard $(printf %q "origin/${BRANCH}") && \
             chmod 600 .env && \
             (chmod +x scripts/deploy-on-server.sh 2>/dev/null || true) && \
             ./scripts/deploy-on-server.sh"

          if [ -n "${CERTBOT_EMAIL:-}" ]; then
            echo "Настройка Nginx и Certbot..."
            ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
              "cd $(printf %q "$DEPLOY_PATH") && chmod +x scripts/setup-nginx-ssl.sh && sudo CERTBOT_EMAIL=$(printf %q "$CERTBOT_EMAIL") PUBLIC_DOMAIN=$(printf %q "$PUBLIC_DOMAIN") INCLUDE_WWW=$(printf %q "${INCLUDE_WWW:-}") APP_PORT=$(printf %q "${APP_PORT:-3000}") bash scripts/setup-nginx-ssl.sh"
          else
            echo "CERTBOT_EMAIL не задан — шаг Nginx/Certbot пропущен"
          fi
