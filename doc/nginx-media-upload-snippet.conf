# Добавьте в server { ... } для домена с Node (pm2 + server.cjs на 127.0.0.1:PORT).
# Иначе загрузка тяжёлых фото может обрываться: net::ERR_TIMED_OUT / 504 Gateway Timeout
# (nginx по умолчанию proxy_read_timeout 60s; sharp/ffmpeg могут дольше на слабом VPS).
#
# Важно: client_max_body_size должен быть не меньше лимитов в server.cjs (фото 10MB, видео 50MB на файл).

client_max_body_size 60m;

location /api/media/upload {
    # Порт как у процесса pm2 (echo $PORT / pm2 show), часто 3000
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
}

# Если у вас один общий location / { proxy_pass ... } без отдельного блока выше,
# добавьте те же таймауты и client_max_body_size внутрь общего location или в server.
