# Вставьте ВЫШЕ общего location / в server { ... } для altdi.ru (HTTPS).
# Тогда POST от ВК попадёт на тот же Node, где крутится server.cjs (порт подставьте свой).

location = /api/vk/callback {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type $http_content_type;
    proxy_pass_request_body on;
}

# После правки:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Проверка с сервера:
#   curl -sS -o /tmp/vkcb.txt -w "%{http_code}" -X POST https://altdi.ru/api/vk/callback \
#     -H "Content-Type: application/json" \
#     -d '{"type":"confirmation","group_id":238093187}'
# Должно вывести 200 и в файле /tmp/vkcb.txt — ровно строка fe17a41e (без HTML).
