# -----------------------------------------------------------------------------
# Вариант A — типично у вас: весь сайт на Next.js, nginx → 127.0.0.1:3000
# -----------------------------------------------------------------------------
# Тогда Callback НЕ настраивают здесь: используйте прокси в Next.js
# (doc/nextjs-proxy-vk-callback-route.ts → src/app/api/vk/callback/route.ts)
# и отдельный процесс server.cjs на внутреннем порту (например 8765).
#
# -----------------------------------------------------------------------------
# Вариант B — исключение только для ВК: Callback напрямую на server.cjs
# -----------------------------------------------------------------------------
# Используйте, если не хотите трогать код Next. Порт справа — тот же, что у
# pm2-процесса server.cjs (PORT в .env altdi-api), обычно 8765.
# Вставьте блок ВЫШЕ location /, который проксирует на 3000.

location = /api/vk/callback {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type $http_content_type;
    proxy_pass_request_body on;
}

# Остальной трафик — как у вас было, на Next:
#   location / {
#       proxy_pass http://127.0.0.1:3000;
#       ...
#   }

#   sudo nginx -t && sudo systemctl reload nginx

